<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <!-- Icon -->
  <g transform="translate(10, 8)">
    <rect x="0" y="0" width="44" height="44" rx="10" fill="url(#logoGrad)" />
    <!-- 3D Box / Inventory Symbol -->
    <path d="M22 10 L34 16 L22 22 L10 16 Z" fill="#ffffff" opacity="0.9" />
    <path d="M10 17 L22 23 L22 34 L10 28 Z" fill="#93c5fd" opacity="0.8" />
    <path d="M34 17 L22 23 L22 34 L34 28 Z" fill="#bfdbfe" opacity="0.9" />
    <!-- Checkmark on front -->
    <circle cx="32" cy="32" r="7" fill="#10b981" />
    <path d="M29 32 L31 34 L35 30" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>
  <!-- Text Brand -->
  <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#0f172a">
    Mini<tspan fill="#2563eb">Stock</tspan>
  </text>
  <text x="65" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="600" letter-spacing="1.5" fill="#64748b">
    QUẢN LÝ KHO &amp; BÁN HÀNG
  </text>
</svg>
